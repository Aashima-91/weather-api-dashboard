<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>Weatherly</h1>
            <p>Check the weather anywhere in the world</p>
        </header>

        <form id="weather-form" class="weather-form">
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="e.g. London" required>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" placeholder="e.g. GB" required>
            </div>

            <div class="form-group">
                <label for="api-key">API Key</label>
                <input type="text" id="api-key" name="api-key" placeholder="Enter your OpenWeatherMap API key" required>
                <small>Get a free API key at openweathermap.org</small>
            </div>

            <button type="submit" id="get-weather-btn" class="btn">
                Get Weather
            </button>
        </form>

        <div id="error-message" class="error-message" role="alert"></div>

        <div id="weather-result" class="weather-result">
            <div class="weather-card">
                <div class="weather-main">
                    <div id="weather-icon" class="weather-icon"></div>
                    <div class="temp-display">
                        <span id="temperature" class="temperature">--°</span>
                        <span class="temp-unit">C</span>
                    </div>
                </div>
                <div class="weather-details">
                    <h2 id="location-name" class="location-name">Location</h2>
                    <p id="condition" class="condition">Weather condition</p>
                    <div id="extra-info" class="extra-info"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
